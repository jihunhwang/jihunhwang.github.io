- date: June 2020
  text: >-
    I started working with Professor
    [Adam O'Neill](https://groups.cs.umass.edu/oneill/) on Multi-Input
    [Functional Encryption](https://eprint.iacr.org/2010/556.pdf) (MIFE) based
    privacy-preserving contact tracing.

- date: May 2020
  text: >-
    I gave a short talk at the UMass Geometric Analysis Reading Seminar on May
    7th on the recent progress in
    [the embedded Calabi-Yau conjecture](https://mathoverflow.net/questions/308443/on-the-calabi-yau-conjecture-for-minimal-surfaces),
    by Colding-Minicozzi and Meeks-Perez-Ros!
    [Here](https://drive.google.com/file/d/1gw3eaI9tQFrcVB2hw3cm1b6VyELKp8Bn/view?usp=sharing)
    are my notes.

- date: April 2020
