# ---------------------------------------------------------------- 2020

- date: October 2020
  text: >-
    I gave a talk at the [UMass CS Theory Seminar](https://groups.cs.umass.edu/theory/)
    with a colleague of mine (Kyle Doney) about
    [candidate indistinguishability obfuscators](https://eprint.iacr.org/2013/451).
    [Here](https://drive.google.com/file/d/1BvUJ94ZzMdUmaD9_-SmIjr4hHruHGZVz/view?usp=sharing)
    is the abstract of the talk.

- date: August 2020
  text: >-
    I gave a talk at the UMass Geometric Analysis Reading Seminar about the
    [Dorfmeister-Pedit-Wu](https://www.intlpress.com/site/pub/files/_fulltext/journals/cag/1998/0006/0004/CAG-1998-0006-0004-a001.pdf)
