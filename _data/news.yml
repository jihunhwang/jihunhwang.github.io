# News / timeline entries, newest first. Rendered by _includes/news_list.html.
#
# Fields
#   date:  shown as-is ("May 2026", "Summer 2024", "September 27th, 2018").
#          Must END with the 4-digit year; entries are grouped by it.
#   text:  Markdown (inline HTML also works).
#   note:  optional, Markdown, shown below the text in small muted type
#          (e.g. "*Edit*: the title is now ...").
#   refs:  optional map of link targets looked up from other data files, so the
#          link stays correct if you change the URL there. Use as [label](@key):
#            refs:
#              slides: { data: talks_invited, title: "Exact talk title", field: slides }
#
# People (looked up in _data/people.yml; only use names that exist there)
#   @[Hemanta Maji]              -> linked "Hemanta Maji"
#   [Christina](@Christina Garman) -> linked custom text


