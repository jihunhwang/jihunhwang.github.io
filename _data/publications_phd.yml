- title: "Beyond All-or-Nothing Corruption: Additive Secret Sharing under Hamming-Weight Leakage"
  coauthors:
    - "Aniruddha Biswas"
    - "Hemanta Maji"
    - "Ilya Shkredov"
    - "Xiuyu Ye"
  full_version: "https://www.cs.purdue.edu/homes/hmaji/papers/BHMSY26b.pdf"
  venue: "Preprint"
  venue_full: "Preprint"
  abbr: "Preprint"
  cv: true
  abstract:
    - 'Side-channel attacks threaten secret sharing, as well as the threshold protocols and masking defenses built on it. Motivated by power analysis, Faust et al. (EUROCRYPT 2024) initiated the theoretical study of additive secret sharing over the cyclic group $\mathbb{Z}/N\mathbb{Z}$ when each share leaks its Hamming weight. They asked whether these weights, taken together, reveal vanishingly little about the secret as the modulus grows.'
    - 'For Mersenne $N=2^n-1$ with prime exponent $n$, they proved insecurity $\ll_k n^{-k/4+1}$, establishing security for $k\ge5$ shares. Two shares were known to be insecure there, but the practically important three- and four-share cases remained open. So did non-Mersenne moduli, including the dyadic modulus $N=2^n$, and the question of how quickly insecurity could decay.'
    - 'We prove security for every near-dyadic modulus $| N-2^n | \leq 2^n/n$ and every fixed $k\geq3$, with insecurity $\ll_k {n^{-k/2+5/4}}$. This gives the first security guarantees for three and four shares and for non-Mersenne moduli, including the dyadic moduli. The leading share-dependent term improves to $n^{-k/2}$, and our lower bounds show that this dependence on $k$ is optimal. Roughly speaking, doubling the share length buys $k/2$ additional bits of statistical security, twice the $k/4$ guaranteed before. At this scale, a fixed target insecurity requires only the square root of the share length prescribed by the earlier analysis.'
    - 'Our proof uses Fourier energy to bound insecurity, contracting it by ${n^{-1/2}}$ per share. We identify Bernoulli dynamics as the broader mechanism underlying Faust et al.&#8217;s exact binary rotation phenomenon and extend the analysis to near-dyadic moduli. For the lower bounds, we identify Fourier modes that retain information about the secret. The estimates rely on spectral estimates obtained from generating functions and Cauchy&#8217;s coefficient formula.'

- title: "Energy Estimation of the Hamming Slice and its Applications"
  coauthors:
    - "Aniruddha Biswas"
    - "Hemanta Maji"
    - "Ilya Shkredov"
    - "Xiuyu Ye"
  arXiv: "https://arxiv.org/abs/2609.08056"
  venue: "Preprint"
  venue_full: "Preprint"
  abbr: "Preprint"
  cv: true
  abstract:
    - 'Let $R=\mathbb{Z}/(2^n-1)\mathbb{Z}$, where $n\geq 3$, and let $S_w\subseteq R$ be the residues whose canonical $n$-digit binary expansion has Hamming weight $w$. We obtain, in particular, an asymptotic formula for the additive energy of $S_w$ 
      $$E(S_w)=\frac{|S_w|^4}{|R|}+ \mathcal{O}\left(|R|^3n^{-3} \right),$$
      which holds uniformly in $w$. The error term is optimal in order, with a matching lower bound for $w=\lfloor n/2+\sqrt{n} \rfloor$. It follows that triple sums of arbitrary unit dilates have asymptotically uniform representation counts when $\prod_{j=1}^{3} |S_{w_j}| /\left( |R| n^{-3/5}\right)^3\to\infty$, and that double sums have asymptotically full support when $|S_{w_1}| |S_{w_2}| / \left( |R| n^{-3/4}\right)^2\to\infty$. In the proof, modular collisions are represented using a cyclic binary carry automaton; this appears to be a novel approach in this area of problems.'


- title: "Resilience of Inner-Product Masking Scheme against Hamming Weight Leakage"
  coauthors:
    - "Aniruddha Biswas"
    - "Hemanta Maji"
    - "Xiuyu Ye"
  full_version: "https://www.cs.purdue.edu/homes/hmaji/papers/BHMY26.pdf"
  doi: "10.4230/LIPIcs.ITC.2026.9"
  venue: "ITC 2026"
  venue_full: "7th Conference on Information-Theoretic Cryptography"
  abbr: "ITC"
  venue_url: "https://itcrypto.github.io/2026/"
  slides: "https://drive.google.com/file/d/1_4GaqQsRCbgHsyWFBcnG4gp73viOCdRA/view?usp=sharing"
  cv: true
  abstract: 
    - "Additive masking is a widely used countermeasure against side-channel attacks in which a secret is additively split into multiple random shares. However, over binary fields, the number of 1's in the binary representation (i.e., the Hamming weight) of the shares reveals information about the original secret. Inner product masking scheme has been proposed as a promising alternative that is secure against such information leakage."
    - "In this work, we establish that inner product masking over a binary extension field is provably secure against Hamming weight leakage, and it translates into security against arbitrary symmetric function leakage from the shares. In addition, we present an efficiently computable score function that quantifies its security against leakages, enabling users to test and certify its security. Finally, we derive a relationship between the leakage resilience of inner-product masking and additive masking over an arbitrary field; roughly speaking, they are at least as secure as additive masking. Our approach is Fourier-analytic and involves estimating spectral norms of the Hamming slice by studying Krawtchouk polynomials."

- title: "Leakage-Resilience of Shamir's Secret Sharing: Identifying Secure Evaluation Places"
  coauthors:
    - "Hai Nguyen"
    - "Hemanta Maji"
    - "Xiuyu Ye"
  doi: "10.4230/LIPIcs.ITC.2025.3"
  full_version: "https://www.cs.purdue.edu/homes/hmaji/papers/HMNY24.pdf"
  venue: "ITC 2025"
  venue_full: "6th Conference on Information-Theoretic Cryptography"
  abbr: "ITC"
  venue_url: "https://itcrypto.github.io/2025/"
  cv: true
  abstract: 
    - "Can Shamir's secret-sharing protect its secret even when all shares are partially compromised?"
    - 'For instance, repairing Reed-Solomon codewords, when possible, recovers the entire secret in the corresponding Shamir’s secret sharing. Yet, Shamir’s secret sharing mitigates various side-channel threats, depending on where its secret-sharing polynomial is evaluated. Although most evaluation places yield secure schemes, none are known explicitly; even techniques to identify them are unknown. Our work initiates research into such classifier constructions and derandomization objectives.'
    - "In this work, we focus on Shamir’s scheme over prime fields, where every share is required to reconstruct the secret. We investigate the security of these schemes against single-bit probes into shares stored in their native binary representation. Technical analysis is particularly challenging when dealing with Reed-Solomon codewords over prime fields, as observed recently in the code repair literature. Furthermore, ensuring the statistical independence of the leakage from the secret necessitates the elimination of any subtle correlations between them. "
    - "In this context, we present: 1) An efficient algorithm to classify evaluation places as secure or vulnerable against the least-significant-bit leakage. 2) Modulus choices where the classifier above extends to any single-bit probe per share. 3) Explicit modulus choices and secure evaluation places for them.  On the way, we discover new bit-probing attacks on Shamir’s scheme, revealing surprising correlations between the leakage and the secret, leading to vulnerabilities when choosing evaluation places naïvely."
    - "Our results rely on new techniques to analyze the security of secret-sharing schemes against side-channel threats. We connect their leakage resilience to the orthogonality of square wave functions, which, in turn, depends on the 2-adic valuation of rational approximations. These techniques, novel to the security analysis of secret sharings, can potentially be of broader interest."