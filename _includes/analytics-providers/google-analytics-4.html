  Original GA4 snippet (kept for easy revert):

<script async src="https://www.googletagmanager.com/gtag/js?id={{site.analytics.google.tracking_id}}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', '{{site.analytics.google.tracking_id}}');
</script>
{% endcomment %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{site.analytics.google.tracking_id}}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  /* Bot filtering. Real visitors are tagged traffic_type=external and a
     GA4 data filter keeps ONLY external traffic. "Ghost" hits sent straight
     to Google (never loading this page) never get the tag, so they are
     dropped. Visitors that load the page but look like bots get
     traffic_type=bot, which the filter also drops.
     Use block comments only: the build minifies this script onto one
     line, so a line comment would swallow the code after it. */
  var botResolutions = ['1280x1200'];
  var resolution = screen.width + 'x' + screen.height;
  var suspect = navigator.webdriver === true ||
                botResolutions.indexOf(resolution) !== -1;

  gtag('config', '{{site.analytics.google.tracking_id}}',
       { traffic_type: suspect ? 'bot' : 'external' });
</script>
